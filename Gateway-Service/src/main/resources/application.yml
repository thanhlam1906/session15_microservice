server:
  port: 8080

app:
  jwt:
    secret: ThisIsASecretKeyForHS256AlgorithmMustBeAtLeast256BitsLong!!

spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
        - id: course-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/courses/**
